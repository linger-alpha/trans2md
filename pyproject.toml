[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trans2md"
version = "0.1.0"
description = "基于 MinerU API 的文档转 Markdown CLI。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3.0",
  "typer>=0.16,<1.0",
  "platformdirs>=4.0,<5.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
trans2md = "trans2md.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trans2md = ["skill_bundle/**"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
